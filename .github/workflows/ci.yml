name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/deploy.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/deploy.yml']

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab_dev_password
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://collab_app:collab_app_dev_password@localhost:5432/collab
      MIGRATION_DATABASE_URL: postgresql://collab:collab_dev_password@localhost:5432/collab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Build
        working-directory: api
        run: npm run build

      - name: Unit tests
        working-directory: api
        run: npm test

      - name: Integration tests
        working-directory: api
        run: npm run test:e2e

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  images:
    name: Images
    runs-on: ubuntu-24.04-arm
    needs: [api, web]
    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/ahmedgamall1/collab-api:${{ github.sha }}
            ghcr.io/ahmedgamall1/collab-api:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/ahmedgamall1/collab-web:${{ github.sha }}
            ghcr.io/ahmedgamall1/collab-web:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,mode=max,scope=web-arm64
