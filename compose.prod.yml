name: collab-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: collab
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: ghcr.io/ahmedgamall1/collab-api:${IMAGE_TAG:-latest}
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "true"
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      DATABASE_URL: postgresql://collab_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/collab
      MIGRATION_DATABASE_URL: postgresql://collab:${POSTGRES_PASSWORD}@db:5432/collab
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      GITHUB_CLIENT_ID:
      GITHUB_CLIENT_SECRET:
    logging: *logging

  web:
    image: ghcr.io/ahmedgamall1/collab-web:${IMAGE_TAG:-latest}
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  db_data:
  caddy_data:
  caddy_config:
